name: fresh_farmapp
description: "A single vendor e-commerce platform for fresh mushrooms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network & API Integration
  dio: ^5.4.0            # Robust HTTP client for your Node.js API
  get_it: ^7.6.0         # Service locator for dependency injection

  # Firebase Core & Auth
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.7.10 # For push notifications

  # UI & Utilities
  google_fonts: ^6.1.0
  intl: ^0.19.0          # For currency and date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true