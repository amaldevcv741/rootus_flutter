name: fresh_farmapp
description: "A single vendor e-commerce platform for fresh mushrooms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network & API Integration
  dio: ^5.4.0            # Robust HTTP client for your Node.js API
  get_it: ^7.6.0         # Service locator for dependency injection

  # Firebase Core & Auth
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_messaging: ^16.3.0 # For push notifications
  flutter_local_notifications: ^18.0.1

  # UI & Utilities
  google_fonts: ^6.1.0
  intl: ^0.19.0          # For currency and date formatting
  shared_preferences: ^2.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  webview_flutter: ^4.14.1
  google_nav_bar: ^5.0.7
  image_picker: ^1.2.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/